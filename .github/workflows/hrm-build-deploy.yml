# .github/workflows/hrm-build-deploy.yml  (put this file in the OpenSky HRM repo)
#
# Runs ONLY when you press "Run workflow" (no run on commit or pull request).
# deploy = none  -> build + test only (nothing is deployed)
# "Run workflow" button -> build + test, then deploy what you choose to HRIS-Basic-01 (needs approval, see "environment")
# Droplets are listed in .github/hrm-fleet.json. SSH on the droplets is closed to the internet: during a deploy the workflow adds the
# IP of the GitHub machine (one /32 address) to the DigitalOcean cloud firewall, deploys, and ALWAYS removes it again.
#
# API customers: tick the boxes "Customer: <name>" in the Run workflow form. The order is always the order of the boxes
# (demo first). Any other site name can be typed in the "extra customers" field.
# To add a NEW customer to the list: add a boolean input (cust_<name>), one env line (T_<NAME>) and one "add <name> ..." line below.
#
# The backend path is confirmed (first run built the API). The frontend folder is found automatically.
name: HRM build and deploy

on:
  workflow_dispatch:      # only the "Run workflow" button starts this (no automatic run on commits)
    inputs:
      deploy:
        description: "What to deploy"
        type: choice
        options: [none, api, web, both]
        default: none
      droplet:
        description: "Which droplet (listed in .github/hrm-fleet.json). To add a droplet: add it to that file AND to this list"
        type: choice
        options: [hris-basic-01]
        default: hris-basic-01
      cust_demo:
        description: "API customer: demo"
        type: boolean
        default: true
      cust_epic:
        description: "API customer: epic"
        type: boolean
        default: false
      cust_gamma:
        description: "API customer: gamma"
        type: boolean
        default: false
      cust_mbkh:
        description: "API customer: mbkh"
        type: boolean
        default: false
      cust_nexawave:
        description: "API customer: nexawave"
        type: boolean
        default: false
      cust_rambank:
        description: "API customer: rambank"
        type: boolean
        default: false
      cust_stagecafe:
        description: "API customer: stagecafe"
        type: boolean
        default: false
      customers:
        description: "Extra API customers not in the boxes above (site names, comma separated). Normally leave EMPTY. The web part always updates ALL customers of the shared frontend."
        type: string
        default: ""
      dry_run:
        description: "Dry run = only run 'plan' on the server, change nothing (keep ON for the first runs)"
        type: boolean
        default: true

concurrency:
  group: hrm-deploy
  cancel-in-progress: false

env:
  BACKEND_CSPROJ: Backend/OpenSkyHRM.Api/OpenSkyHRM.Api.csproj   # confirmed
  TEST_PROJECT: ""                                               # CHECK, e.g. Backend/OpenSkyHRM.Api.Tests ; empty = skip tests
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"

jobs:
  build-api:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write   # delete old Actions artifacts so the account storage quota can recover
    steps:
      - uses: actions/checkout@v4
      - name: Delete stored Actions artifacts (the account storage quota is full)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100,
            })
            const stale = artifacts.filter(a => a.name === "api" || a.name === "web")
            for (const artifact of stale) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id })
              core.info(`deleted artifact ${artifact.name} #${artifact.id}`)
            }
            core.info(`deleted ${stale.length} artifact(s); left ${artifacts.length - stale.length}`)
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "${{ env.DOTNET_VERSION }}" }
      - name: Test
        run: |
          if [ -n "$TEST_PROJECT" ]; then dotnet test "$TEST_PROJECT" -c Release; else echo "no TEST_PROJECT set, tests skipped"; fi
      - name: Publish (framework-dependent, the droplet has the .NET 8 runtime)
        run: dotnet publish "$BACKEND_CSPROJ" -c Release -o publish-api -p:UseAppHost=false
      - name: Check the publish folder
        run: test -f publish-api/OpenSkyHRM.Api.dll && test -f publish-api/OpenSkyHRM.Api.deps.json && ls publish-api | wc -l
      - name: Pack
        run: tar -czf api.tgz -C publish-api .
      # Actions artifact storage is a small billed quota (the previous upload-artifact step failed once it was full).
      # The cache is a separate 10 GB store and is only written when a deploy will read the package.
      - name: Save the API package for the deploy job
        if: inputs.deploy == 'api' || inputs.deploy == 'both'
        uses: actions/cache/save@v4
        with:
          path: api.tgz
          key: hrm-api-${{ github.run_id }}-${{ github.run_attempt }}

  build-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find the frontend folder (the package.json that uses Next.js)
        id: fe
        run: |
          d=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' -exec grep -l '"next"' {} + | head -1 | xargs -r dirname)
          if [ -z "$d" ]; then echo "::error::no Next.js package.json found in the repo"; find . -maxdepth 3 -name package.json -not -path '*/node_modules/*'; exit 1; fi
          d=${d#./}
          if [ ! -f "$d/package-lock.json" ]; then echo "::error::$d has no package-lock.json (needed for npm ci)"; ls -la "$d"; exit 1; fi
          echo "frontend folder: $d"; echo "dir=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ steps.fe.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.fe.outputs.dir }}
      - name: "Build (do NOT set VERCEL: the server build writes to .dist)"
        working-directory: ${{ steps.fe.outputs.dir }}
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # add NEXT_PUBLIC_* values here only if the dev team says the build needs them
      - name: Check the build
        working-directory: ${{ steps.fe.outputs.dir }}
        run: test -f .dist/BUILD_ID && test -f package-lock.json && test -f next.config.js
      - name: "Pack (no node_modules: the server runs \"npm ci\" itself)"
        working-directory: ${{ steps.fe.outputs.dir }}
        run: |
          B="$GITHUB_WORKSPACE/web-build"; mkdir -p "$B"
          cp -r .dist public package.json package-lock.json next.config.js "$B"/
          if [ -d config ]; then cp -r config "$B"/; fi
          tar -czf "$GITHUB_WORKSPACE/web.tgz" -C "$B" .
      - name: Save the web package for the deploy job
        if: inputs.deploy == 'web' || inputs.deploy == 'both'
        uses: actions/cache/save@v4
        with:
          path: web.tgz
          key: hrm-web-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: [build-api, build-web]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    runs-on: ubuntu-24.04
    environment: production        # add "Required reviewers" to this environment in the repo settings
    env:
      DROPLET: ${{ inputs.droplet }}
      MODE: ${{ inputs.dry_run && 'plan' || 'apply' }}
      WHAT: ${{ inputs.deploy }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
    steps:
      - name: Work out the API customer list (ticked boxes first, then the extra field)
        env:
          T_DEMO: ${{ inputs.cust_demo }}
          T_EPIC: ${{ inputs.cust_epic }}
          T_GAMMA: ${{ inputs.cust_gamma }}
          T_MBKH: ${{ inputs.cust_mbkh }}
          T_NEXAWAVE: ${{ inputs.cust_nexawave }}
          T_RAMBANK: ${{ inputs.cust_rambank }}
          T_STAGECAFE: ${{ inputs.cust_stagecafe }}
          EXTRA: ${{ inputs.customers }}
        run: |
          list=""
          add(){ if [ "$2" = "true" ]; then list="${list:+$list,}$1"; fi; }
          add demo "$T_DEMO"
          add epic "$T_EPIC"
          add gamma "$T_GAMMA"
          add mbkh "$T_MBKH"
          add nexawave "$T_NEXAWAVE"
          add rambank "$T_RAMBANK"
          add stagecafe "$T_STAGECAFE"
          extra=$(printf '%s' "$EXTRA" | tr -d ' ')
          if [ -n "$extra" ]; then list="${list:+$list,}$extra"; fi
          if { [ "$WHAT" = api ] || [ "$WHAT" = both ]; } && [ -z "$list" ]; then
            echo "::error::the deploy includes the API but no customer is ticked"; exit 1
          fi
          echo "CUSTOMERS=$list" >> "$GITHUB_ENV"
          echo "API customers (in this order): ${list:-none}"
      - uses: actions/checkout@v4
      - name: Restore the API package
        if: inputs.deploy == 'api' || inputs.deploy == 'both'
        uses: actions/cache/restore@v4
        with:
          path: api.tgz
          key: hrm-api-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hrm-api-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Restore the web package
        if: inputs.deploy == 'web' || inputs.deploy == 'both'
        uses: actions/cache/restore@v4
        with:
          path: web.tgz
          key: hrm-web-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hrm-web-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Read the droplet from hrm-fleet.json
        run: |
          f=.github/hrm-fleet.json
          jq -e --arg d "$DROPLET" '.droplets[$d]' "$f" > /dev/null || { echo "::error::droplet $DROPLET is not in $f"; exit 1; }
          get(){ jq -r --arg d "$DROPLET" --arg k "$1" '.droplets[$d][$k] // empty' "$f"; }
          H=$(get host); U=$(get user); F=$(get firewall_id); K=$(get host_key)
          [[ "$H" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::bad host in fleet file"; exit 1; }
          [[ "$U" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::bad user in fleet file"; exit 1; }
          [[ "$F" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::bad firewall_id in fleet file"; exit 1; }
          [[ "$K" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+$ ]] || { echo "::error::bad host_key in fleet file (expected: ssh-ed25519 AAAA...)"; exit 1; }
          { echo "HOST=$H"; echo "DUSER=$U"; echo "FW=$F"; echo "HOSTKEY=$K"; } >> "$GITHUB_ENV"
          echo "droplet $DROPLET -> $U@$H"
      - name: Open SSH on the cloud firewall for this runner only (one IP, removed at the end)
        id: fw
        run: |
          ip=$(curl -fsS https://api.ipify.org); [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::could not get the runner IP"; exit 1; }
          body=$(jq -nc --arg s "$ip/32" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$s]}}]}')
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $DO_TOKEN" -H 'Content-Type: application/json' -d "$body" "https://api.digitalocean.com/v2/firewalls/$FW/rules")
          if [ "$code" != 204 ]; then echo "::error::DigitalOcean answered HTTP $code"; cat resp.txt; exit 1; fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"; echo "opened SSH for $ip/32"
      - name: SSH setup (waits until the firewall change is active)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          printf '%s %s\n' "$HOST" "$HOSTKEY" > ~/.ssh/known_hosts
          printf 'Host droplet\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ConnectTimeout 6\n  ServerAliveInterval 30\n' "$HOST" "$DUSER" > ~/.ssh/config
          ok=0; for i in $(seq 1 30); do if ssh droplet 'hostname'; then ok=1; break; fi; echo "waiting for the firewall ($i/30)"; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::cannot reach the droplet over SSH"; exit 1; }
          ssh droplet 'mkdir -p ~/incoming && find ~/incoming -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} +'
      - name: Upload the builds
        run: |
          S=${GITHUB_SHA::10}
          if [ "$WHAT" = api ] || [ "$WHAT" = both ]; then
            mkdir -p up/api-$S && tar -xzf api.tgz -C up/api-$S
            rsync -az --delete up/api-$S/ droplet:incoming/api-$S/
          fi
          if [ "$WHAT" = web ] || [ "$WHAT" = both ]; then
            mkdir -p up/web-$S && tar -xzf web.tgz -C up/web-$S
            rsync -az --delete up/web-$S/ droplet:incoming/web-$S/
          fi
      - name: Deploy the API, customer by customer (stops at the first failure)
        if: inputs.deploy == 'api' || inputs.deploy == 'both'
        run: |
          S=${GITHUB_SHA::10}
          for c in $(echo "$CUSTOMERS" | tr ',' ' '); do
            [[ "$c" =~ ^[a-z0-9]+$ ]] || { echo "bad customer name: $c"; exit 1; }
            echo "::group::api $MODE $c"
            ssh droplet "sudo /usr/local/sbin/hr-release.sh api $MODE $c /home/$DUSER/incoming/api-$S"
            echo "::endgroup::"
          done
      - name: Deploy the shared frontend (ALL customers of hrweb on this droplet)
        if: inputs.deploy == 'web' || inputs.deploy == 'both'
        run: |
          S=${GITHUB_SHA::10}
          ssh droplet "sudo /usr/local/sbin/hr-release.sh web $MODE /home/$DUSER/incoming/web-$S"
      - name: Summary
        run: |
          echo "### HRM deploy ${GITHUB_SHA::10} to $DROPLET" >> "$GITHUB_STEP_SUMMARY"
          echo "- mode: **$MODE** (dry run = nothing changed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployed: $WHAT; API customers: ${CUSTOMERS:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Close SSH on the cloud firewall again (runs even when the deploy failed)
        if: always() && steps.fw.outputs.ip != ''
        env:
          RUNNER_IP: ${{ steps.fw.outputs.ip }}
        run: |
          body=$(jq -nc --arg s "$RUNNER_IP/32" '{inbound_rules:[{protocol:"tcp",ports:"22",sources:{addresses:[$s]}}]}')
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X DELETE -H "Authorization: Bearer $DO_TOKEN" -H 'Content-Type: application/json' -d "$body" "https://api.digitalocean.com/v2/firewalls/$FW/rules")
          if [ "$code" = 204 ]; then echo "closed SSH for $RUNNER_IP/32"; else echo "::error::could NOT remove the firewall rule for $RUNNER_IP (HTTP $code). Remove it by hand in DigitalOcean > Networking > Firewalls."; cat resp.txt; exit 1; fi
