# OpenSky HRM — Expo React Native iOS (app in Mobile/).
#
# One-time Codemagic + Apple setup: docs/codemagic-ios-signing.md
# Reference names below MUST match Code signing identities in Codemagic UI.

workflows:
  opensky-hrm-ios:
    name: OpenSky HRM iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: Mobile
    environment:
      groups:
        - app_store_credentials
      ios_signing:
        provisioning_profiles:
          - OpenSky SFA AppStore Profile
        certificates:
          - OpenSky_HRM_Distribution
      vars:
        BUNDLE_ID: com.cipherlabz.openskyhrm
        APP_STORE_APPLE_ID: 0
      node: v20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Generate native iOS project (Expo prebuild)
        script: |
          npx expo prebuild --platform ios
      - name: Resolve Xcode workspace and scheme
        script: |
          set -e
          WORKSPACE_PATH=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "No .xcworkspace under ios/. Expo prebuild may have failed."
            exit 1
          fi
          XCODE_WORKSPACE=$(basename "$WORKSPACE_PATH")
          XCODE_SCHEME="${XCODE_WORKSPACE%.xcworkspace}"
          echo "XCODE_WORKSPACE=$XCODE_WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$XCODE_SCHEME" >> "$CM_ENV"
          echo "Using workspace=$XCODE_WORKSPACE scheme=$XCODE_SCHEME"
      - name: Set Info.plist export compliance
        script: |
          set -e
          PLIST="ios/$XCODE_SCHEME/Info.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST=$(find ios -name Info.plist | head -1)
          fi
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment iOS build number
        script: |
          set -e
          cd ios
          if [ -z "$APP_STORE_APPLE_ID" ] || [ "$APP_STORE_APPLE_ID" = "0" ]; then
            echo "APP_STORE_APPLE_ID not set; using Codemagic BUILD_NUMBER=$BUILD_NUMBER"
            agvtool new-version -all "$BUILD_NUMBER"
          else
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
            if [ -z "$LATEST_BUILD_NUMBER" ]; then
              agvtool new-version -all "$BUILD_NUMBER"
            else
              agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
            fi
          fi
      - name: Build App Store ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
