# OpenSky HRM - Expo React Native iOS
# App source: Mobile/

workflows:
  opensky-hrm-ios:
    name: OpenSky HRM iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    working_directory: Mobile

    environment:
      groups:
        - app_store_credentials

      # Matches OpenSky SFA AppStore Profile in Codemagic (com.openskylabs.sfa).
      # To use com.cipherlabz.openskyhrm instead, create an App Store profile for that App ID
      # in Apple Developer, Fetch profiles in Codemagic, and revert bundleIdentifier in app.json.
      ios_signing:
        provisioning_profiles:
          - OpenSky SFA AppStore Profile
        certificates:
          - OpenSky SFA Distribution P12

      vars:
        BUNDLE_ID: com.openskylabs.sfa
        APPLE_TEAM_ID: XL576229TS
        APP_STORE_APPLE_ID: "0"

      node: v20
      xcode: latest
      cocoapods: default

    scripts:

      # 1. Install JavaScript dependencies
      - name: Install npm dependencies
        script: |
          set -e
          npm ci

      # 2. Apple team for Expo prebuild (profiles installed at workflow start)
      - name: Prepare Apple team for Expo prebuild
        script: |
          set -e
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$CM_ENV"
          fi
          PROV_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          for f in "$PROV_DIR"/*.mobileprovision; do
            [ -f "$f" ] || continue
            APP_ID=$(security cms -D -i "$f" | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || true)
            echo "Installed profile $(basename "$f"): $APP_ID"
            case "$APP_ID" in
              *".${BUNDLE_ID}"|*"${BUNDLE_ID}")
                echo "Profile matches HRM bundle ${BUNDLE_ID}."
                ;;
              *)
                echo "WARNING: Profile is not for ${BUNDLE_ID}. Create an App Store profile for HRM in Apple Developer and Fetch profiles in Codemagic."
                ;;
            esac
          done

      # 3. Generate native iOS project
      - name: Generate native iOS project
        script: |
          set -e
          npx expo prebuild --platform ios --clean

      # 4. Resolve Xcode workspace and scheme
      - name: Resolve Xcode workspace and scheme
        script: |
          set -e

          WORKSPACE_PATH=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)

          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERROR: No .xcworkspace found under ios/"
            echo "Expo prebuild may have failed."
            exit 1
          fi

          XCODE_WORKSPACE=$(basename "$WORKSPACE_PATH")
          XCODE_SCHEME="${XCODE_WORKSPACE%.xcworkspace}"

          echo "XCODE_WORKSPACE=$XCODE_WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$XCODE_SCHEME" >> "$CM_ENV"

          echo "Using workspace: $XCODE_WORKSPACE"
          echo "Using scheme: $XCODE_SCHEME"

      # 5. Set App Store export compliance
      - name: Set Info.plist export compliance
        script: |
          set -e

          PLIST="ios/$XCODE_SCHEME/Info.plist"

          if [ ! -f "$PLIST" ]; then
            PLIST=$(find ios -name Info.plist | head -1)
          fi

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found."
            exit 1
          fi

          echo "Using Info.plist: $PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            "$PLIST" \
            || /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            "$PLIST"

      # 6. Install CocoaPods
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install

      # 7. Configure iOS code signing
      - name: Set up code signing
        script: |
          set -e

          echo "Configuring iOS code signing..."
          echo "Bundle ID: $BUNDLE_ID"
          echo "Apple Team ID: ${APPLE_TEAM_ID:-not set}"

          keychain initialize
          keychain add-certificates

          echo "Available code signing identities:"
          security find-identity -v -p codesigning || true

          PLIST="ios/$XCODE_SCHEME/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $BUNDLE_ID" "$PLIST"
          fi

          PROFILE_NAME=""
          PROV_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          for f in "$PROV_DIR"/*.mobileprovision; do
            [ -f "$f" ] || continue
            APP_ID=$(security cms -D -i "$f" | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || true)
            case "$APP_ID" in
              *".${BUNDLE_ID}"|*"${BUNDLE_ID}")
                PROFILE_NAME=$(security cms -D -i "$f" | plutil -extract Name raw - 2>/dev/null || true)
                echo "Matched mobileprovision: $PROFILE_NAME ($APP_ID)"
                break
                ;;
            esac
          done

          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: No installed provisioning profile for bundle id ${BUNDLE_ID}."
            exit 1
          fi

          export PROVISIONING_PROFILE_NAME="$PROFILE_NAME"
          gem install xcodeproj --no-document
          ruby scripts/codemagic-ios-signing.rb

          xcode-project use-profiles --project "ios/$XCODE_SCHEME.xcodeproj" || true

      # 8. Increment build number
      - name: Increment iOS build number
        script: |
          set -e

          cd ios

          if [ -z "$APP_STORE_APPLE_ID" ] || [ "$APP_STORE_APPLE_ID" = "0" ]; then

            echo "APP_STORE_APPLE_ID not set."
            echo "Using Codemagic BUILD_NUMBER=$BUILD_NUMBER"

            agvtool new-version -all "$BUILD_NUMBER"

          else

            echo "Getting latest App Store build number..."

            LATEST_BUILD_NUMBER=$(
              app-store-connect get-latest-app-store-build-number \
                "$APP_STORE_APPLE_ID"
            )

            if [ -z "$LATEST_BUILD_NUMBER" ]; then

              echo "No previous build found."
              echo "Using BUILD_NUMBER=$BUILD_NUMBER"

              agvtool new-version -all "$BUILD_NUMBER"

            else

              NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))

              echo "Latest build: $LATEST_BUILD_NUMBER"
              echo "New build: $NEW_BUILD_NUMBER"

              agvtool new-version -all "$NEW_BUILD_NUMBER"

            fi
          fi

      # 9. Build IPA
      - name: Build App Store IPA
        script: |
          set -e

          echo "Building IPA..."
          echo "Workspace: ios/$XCODE_WORKSPACE"
          echo "Scheme: $XCODE_SCHEME"

          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-allowProvisioningUpdates"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

        submit_to_testflight: true
        submit_to_app_store: false
