# OpenSky HRM - Expo React Native iOS
# App source: Mobile/

workflows:
  opensky-hrm-ios:
    name: OpenSky HRM iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    working_directory: Mobile

    environment:
      groups:
        - app_store_credentials

      # Requires an App Store profile for com.cipherlabz.openskyhrm in Code signing identities.
      # OpenSky SFA AppStore Profile (com.openskylabs.sfa) cannot sign OpenSky HRM.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cipherlabz.openskyhrm

      vars:
        BUNDLE_ID: com.cipherlabz.openskyhrm
        APPLE_TEAM_ID: XL576229TS
        APP_STORE_APPLE_ID: "0"

      node: v20
      xcode: latest
      cocoapods: default

    scripts:

      # 1. Install JavaScript dependencies
      - name: Install npm dependencies
        script: |
          set -e
          npm ci

      # 2. Validate profile + team (profiles installed at workflow start)
      - name: Prepare Apple team and validate provisioning profile
        script: |
          set -e
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$CM_ENV"
          fi
          PROV_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MATCHING_PROFILE=""
          for f in "$PROV_DIR"/*.mobileprovision; do
            [ -f "$f" ] || continue
            APP_ID=$(security cms -D -i "$f" | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || true)
            TEAM=$(security cms -D -i "$f" | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || true)
            echo "Found profile $(basename "$f"): application-identifier=$APP_ID team=$TEAM"
            case "$APP_ID" in
              *".${BUNDLE_ID}"|*"${BUNDLE_ID}")
                MATCHING_PROFILE="$f"
                echo "APPLE_TEAM_ID=$TEAM" >> "$CM_ENV"
                echo "Using team $TEAM for bundle $BUNDLE_ID"
                break
                ;;
            esac
          done
          if [ -z "$MATCHING_PROFILE" ]; then
            echo "ERROR: No provisioning profile for bundle id ${BUNDLE_ID}."
            echo ""
            echo "Codemagic only has the SFA profile (com.openskylabs.sfa). HRM uses ${BUNDLE_ID}."
            echo ""
            echo "Fix in Apple Developer (team ${APPLE_TEAM_ID}):"
            echo "  1. Identifiers — ensure App ID ${BUNDLE_ID} exists."
            echo "  2. Profiles — + → App Store Connect → select ${BUNDLE_ID} → your Distribution cert → Generate."
            echo ""
            echo "Then in Codemagic → Code signing identities → iOS provisioning profiles → Fetch profiles"
            echo "→ download the App Store profile for ${BUNDLE_ID} (any reference name)."
            exit 1
          fi

      # 3. Generate native iOS project
      - name: Generate native iOS project
        script: |
          set -e
          npx expo prebuild --platform ios

      # 4. Resolve Xcode workspace and scheme
      - name: Resolve Xcode workspace and scheme
        script: |
          set -e

          WORKSPACE_PATH=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)

          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERROR: No .xcworkspace found under ios/"
            echo "Expo prebuild may have failed."
            exit 1
          fi

          XCODE_WORKSPACE=$(basename "$WORKSPACE_PATH")
          XCODE_SCHEME="${XCODE_WORKSPACE%.xcworkspace}"

          echo "XCODE_WORKSPACE=$XCODE_WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$XCODE_SCHEME" >> "$CM_ENV"

          echo "Using workspace: $XCODE_WORKSPACE"
          echo "Using scheme: $XCODE_SCHEME"

      # 5. Set App Store export compliance
      - name: Set Info.plist export compliance
        script: |
          set -e

          PLIST="ios/$XCODE_SCHEME/Info.plist"

          if [ ! -f "$PLIST" ]; then
            PLIST=$(find ios -name Info.plist | head -1)
          fi

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found."
            exit 1
          fi

          echo "Using Info.plist: $PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            "$PLIST" \
            || /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            "$PLIST"

      # 6. Install CocoaPods
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install

      # 7. Configure iOS code signing
      - name: Set up code signing
        script: |
          set -e

          echo "Configuring iOS code signing..."
          echo "Bundle ID: $BUNDLE_ID"
          echo "Apple Team ID: ${APPLE_TEAM_ID:-not set}"

          PBX="ios/$XCODE_SCHEME.xcodeproj/project.pbxproj"
          if [ ! -f "$PBX" ]; then
            echo "ERROR: Xcode project not found at $PBX"
            exit 1
          fi

          sed -i.bak 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"

          xcode-project use-profiles --project "ios/$XCODE_SCHEME.xcodeproj"

          if ! grep -q "PROVISIONING_PROFILE" "$PBX"; then
            echo "ERROR: No PROVISIONING_PROFILE set on Xcode project after use-profiles."
            exit 1
          fi

      # 8. Increment build number
      - name: Increment iOS build number
        script: |
          set -e

          cd ios

          if [ -z "$APP_STORE_APPLE_ID" ] || [ "$APP_STORE_APPLE_ID" = "0" ]; then

            echo "APP_STORE_APPLE_ID not set."
            echo "Using Codemagic BUILD_NUMBER=$BUILD_NUMBER"

            agvtool new-version -all "$BUILD_NUMBER"

          else

            echo "Getting latest App Store build number..."

            LATEST_BUILD_NUMBER=$(
              app-store-connect get-latest-app-store-build-number \
                "$APP_STORE_APPLE_ID"
            )

            if [ -z "$LATEST_BUILD_NUMBER" ]; then

              echo "No previous build found."
              echo "Using BUILD_NUMBER=$BUILD_NUMBER"

              agvtool new-version -all "$BUILD_NUMBER"

            else

              NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))

              echo "Latest build: $LATEST_BUILD_NUMBER"
              echo "New build: $NEW_BUILD_NUMBER"

              agvtool new-version -all "$NEW_BUILD_NUMBER"

            fi
          fi

      # 9. Build IPA
      - name: Build App Store IPA
        script: |
          set -e

          echo "Building IPA..."
          echo "Workspace: ios/$XCODE_WORKSPACE"
          echo "Scheme: $XCODE_SCHEME"

          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-allowProvisioningUpdates"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

        submit_to_testflight: true
        submit_to_app_store: false
