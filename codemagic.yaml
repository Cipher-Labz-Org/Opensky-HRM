# OpenSky HRM - Expo React Native iOS
# App source: Mobile/

workflows:
  opensky-hrm-ios:
    name: OpenSky HRM iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    working_directory: Mobile

    environment:
      groups:
        - app_store_credentials

      # Auto match fails until Codemagic has an App Store profile for com.cipherlabz.openskyhrm.
      # Reference strings must match Code signing identities exactly.
      ios_signing:
        provisioning_profiles:
          - OpenSky SFA AppStore Profile
        certificates:
          - OpenSky SFA Distribution P12

      vars:
        BUNDLE_ID: com.cipherlabz.openskyhrm
        APP_STORE_APPLE_ID: "0"
        # Apple Developer → Membership → Team ID (required for Expo prebuild / Xcode signing).
        APPLE_TEAM_ID: ""

      node: v20
      xcode: latest
      cocoapods: default

    scripts:

      # 1. Install JavaScript dependencies
      - name: Install npm dependencies
        script: |
          set -e
          npm ci

      # 2. Generate native iOS project
      - name: Generate native iOS project
        script: |
          set -e
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "WARNING: APPLE_TEAM_ID is not set in Codemagic env vars."
            echo "Add your 10-character Apple Team ID under Application environment variables."
          fi
          npx expo prebuild --platform ios

      # 3. Resolve Xcode workspace and scheme
      - name: Resolve Xcode workspace and scheme
        script: |
          set -e

          WORKSPACE_PATH=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)

          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERROR: No .xcworkspace found under ios/"
            echo "Expo prebuild may have failed."
            exit 1
          fi

          XCODE_WORKSPACE=$(basename "$WORKSPACE_PATH")
          XCODE_SCHEME="${XCODE_WORKSPACE%.xcworkspace}"

          echo "XCODE_WORKSPACE=$XCODE_WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$XCODE_SCHEME" >> "$CM_ENV"

          echo "Using workspace: $XCODE_WORKSPACE"
          echo "Using scheme: $XCODE_SCHEME"

      # 4. Set App Store export compliance
      - name: Set Info.plist export compliance
        script: |
          set -e

          PLIST="ios/$XCODE_SCHEME/Info.plist"

          if [ ! -f "$PLIST" ]; then
            PLIST=$(find ios -name Info.plist | head -1)
          fi

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found."
            exit 1
          fi

          echo "Using Info.plist: $PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            "$PLIST" \
            || /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            "$PLIST"

      # 5. Install CocoaPods
      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install

      # 6. Configure iOS code signing
      - name: Set up code signing
        script: |
          set -e

          echo "Configuring iOS code signing..."
          echo "Bundle ID: $BUNDLE_ID"

          # Apply signing only to the app .xcodeproj (not dependency projects under node_modules).
          xcode-project use-profiles --project "ios/"*.xcodeproj

      - name: Verify provisioning profile bundle ID
        script: |
          set -e
          PROFILE=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -z "$PROFILE" ]; then
            echo "WARNING: No provisioning profile on disk after use-profiles."
            exit 0
          fi
          APP_ID=$(security cms -D -i "$PROFILE" 2>/dev/null | plutil -extract Entitlements.application-identifier raw -o - - 2>/dev/null || true)
          echo "Profile application-identifier: ${APP_ID:-unknown}"
          EXPECT="TeamIdentifier.$BUNDLE_ID"
          if [ -n "$APP_ID" ] && [[ "$APP_ID" != *"$BUNDLE_ID"* ]]; then
            echo "ERROR: Provisioning profile does not include bundle ID $BUNDLE_ID."
            echo "OpenSky SFA AppStore Profile may be for a different app."
            echo "In Apple Developer, create an App Store profile for com.cipherlabz.openskyhrm and upload it to Codemagic."
            exit 1
          fi

      # 7. Increment build number
      - name: Increment iOS build number
        script: |
          set -e

          cd ios

          if [ -z "$APP_STORE_APPLE_ID" ] || [ "$APP_STORE_APPLE_ID" = "0" ]; then

            echo "APP_STORE_APPLE_ID not set."
            echo "Using Codemagic BUILD_NUMBER=$BUILD_NUMBER"

            agvtool new-version -all "$BUILD_NUMBER"

          else

            echo "Getting latest App Store build number..."

            LATEST_BUILD_NUMBER=$(
              app-store-connect get-latest-app-store-build-number \
                "$APP_STORE_APPLE_ID"
            )

            if [ -z "$LATEST_BUILD_NUMBER" ]; then

              echo "No previous build found."
              echo "Using BUILD_NUMBER=$BUILD_NUMBER"

              agvtool new-version -all "$BUILD_NUMBER"

            else

              NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))

              echo "Latest build: $LATEST_BUILD_NUMBER"
              echo "New build: $NEW_BUILD_NUMBER"

              agvtool new-version -all "$NEW_BUILD_NUMBER"

            fi
          fi

      # 8. Build IPA
      - name: Build App Store IPA
        script: |
          set -e

          echo "Building IPA..."
          echo "Workspace: ios/$XCODE_WORKSPACE"
          echo "Scheme: $XCODE_SCHEME"

          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

        submit_to_testflight: true
        submit_to_app_store: false
